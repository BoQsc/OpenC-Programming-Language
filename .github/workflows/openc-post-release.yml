name: OpenC published release integrity

on:
  push:
    branches:
      - master
    paths:
      - OpenC-1.0/scripts/verify_sh27_post_release.py
      - .github/workflows/openc-post-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openc-v1.0.0-public-integrity
  cancel-in-progress: false

jobs:
  verify:
    name: Stream-verify immutable v1.0.0
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download and verify all public release assets
        run: >-
          python OpenC-1.0/scripts/verify_sh27_post_release.py
          --output artifacts/sh27-public-release-verification.json

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenC-1.0.0-public-integrity-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: artifacts/sh27-public-release-verification.json
